name: CI

# This workflow verifies source changes only. Nothing here deploys, publishes,
# or sends anything -- it only runs the local verify suite (packet 12, task step
# "Add npm run verify to execute typecheck, lint, unit tests, build, and the
# bounded Playwright suite").
#
# The push list mirrors scripts/vercel-ignore-build.mjs, which Vercel's
# "ignoreCommand" already enforces for deploys: build main, staging, and
# preview/*; skip every dependabot/*, codex/*, claude/*, wip/*, and unlisted
# branch. Keeping those two in lockstep means a branch that Vercel would
# deploy always has a green (or red) CI run to point at first.
#
# pull_request is deliberately NOT filtered to that list. Every change in this
# repository arrives as a pull request from a codex/* or claude/* branch, none
# of which Vercel deploys, so mirroring the deploy allowlist here left review
# with nothing to look at: the suite first ran after the merge to main, which
# is the one moment it can no longer stop anything. Verifying the merge result
# of any pull request, whatever the branch is called, is the point of having
# the suite. Deploys stay restricted; only verification is opened up.
#
# Quoted "on" deliberately: unquoted `on:` parses as the boolean `true` under
# YAML 1.1 (the "Norway problem"). GitHub Actions' own parser tolerates the
# unquoted form, but quoting removes the ambiguity for every other YAML tool
# that touches this file (linters, editors, this repo's own JSON/YAML checks).
"on":
  push:
    branches:
      - main
      - staging
      - "preview/**"
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

# Keyed on the pull request number when there is one, so a rapid series of
# pushes to the same PR cancels its own superseded runs without touching the
# push-triggered run for the branch it merges into.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: npm run verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          # The installed Supabase realtime client relies on Node's native
          # WebSocket implementation. Node 24 is the current supported LTS
          # line and also matches the repository's @types/node generation.
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (chromium only)
        # Matches the bounded suite both workstreams use verbatim:
        #   npx playwright test tests/e2e --project=chromium
        # A fresh runner has no browsers installed; webkit/firefox are not
        # needed here because npm run verify only runs the chromium project.
        run: npx playwright install --with-deps chromium

      - name: Run verify (typecheck, lint, unit tests, build, bounded Playwright suite)
        run: npm run verify
