name: CI

"on":
  push:
    branches:
      - main
      - staging
    paths-ignore:
      - "docs/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - "design-qa.md"
      - ".github/pull_request_template.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - "design-qa.md"
      - ".github/pull_request_template.md"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: npm run verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run complete runtime verification
        run: npm run verify
